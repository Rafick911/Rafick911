<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="PINPONG TIPS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16233d"/>
      <stop offset="55%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#070c17"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7d6f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="30%" cy="18%" r="80%">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#glow)"/>
  <rect x="14" y="14" width="484" height="484" rx="100" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="2"/>

  <!-- Raquette -->
  <g transform="rotate(-32 256 250)">
    <ellipse cx="256" cy="212" rx="112" ry="126" fill="#0d1526" stroke="url(#blade)" stroke-width="12"/>
    <ellipse cx="256" cy="212" rx="86" ry="100" fill="none" stroke="rgba(79,140,255,.35)" stroke-width="3"/>
    <line x1="256" y1="112" x2="256" y2="312" stroke="rgba(79,140,255,.22)" stroke-width="2"/>
    <line x1="170" y1="212" x2="342" y2="212" stroke="rgba(79,140,255,.22)" stroke-width="2"/>
    <rect x="238" y="330" width="36" height="112" rx="18" fill="url(#blade)"/>
    <rect x="238" y="330" width="36" height="112" rx="18" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
  </g>

  <!-- Balle -->
  <circle cx="380" cy="360" r="54" fill="url(#ball)"/>
  <path d="M334 336a54 54 0 0 1 92 40" fill="none" stroke="rgba(37,99,235,.35)" stroke-width="5" stroke-linecap="round"/>
  <path d="M428 384a54 54 0 0 1-92-40" fill="none" stroke="rgba(37,99,235,.22)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="380" cy="360" r="54" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="2"/>

  <!-- Mouvement -->
  <path d="M120 132c-26 22-42 54-42 90" fill="none" stroke="rgba(34,211,238,.45)" stroke-width="8" stroke-linecap="round"/>
  <path d="M150 160c-16 15-26 36-26 60" fill="none" stroke="rgba(34,211,238,.25)" stroke-width="8" stroke-linecap="round"/>
</svg>
